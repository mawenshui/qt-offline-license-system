name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: win64_mingw81
          cache: true

      - name: Configure and build
        shell: pwsh
        run: |
          New-Item -ItemType Directory build | Out-Null
          Set-Location build
          qmake ..\LicenseSystem.pro CONFIG+=release
          mingw32-make -j2

      - name: Run full-flow tests
        shell: pwsh
        run: .\tests\full_flow.ps1 -Version 1.0.1 -SkipBuild
